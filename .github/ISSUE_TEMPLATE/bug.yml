name: Bug
description: Báo cáo hành vi sai hoặc lỗi hồi quy.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Hành vi hiện tại
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hành vi mong đợi
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Môi trường và bằng chứng
      description: Branch, trình duyệt, log đã loại bỏ dữ liệu nhạy cảm, ảnh hoặc video.
