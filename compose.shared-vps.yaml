# Dùng cùng compose.production.yaml trên VPS có Nginx và nhiều dự án.
# Không khởi động Caddy; API chỉ nhận kết nối từ chính VPS.
name: mot-me-banh

services:
  postgres:
    cpus: 1.0
    mem_limit: 1536m

  migrate:
    cpus: 1.0
    mem_limit: 2g
    environment:
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
      SEED_CUSTOMER_DISPLAY_NAME: ${SEED_CUSTOMER_DISPLAY_NAME:-}

  api:
    cpus: 1.0
    mem_limit: 768m
    ports:
      - "127.0.0.1:${API_BIND_PORT:-3080}:3000"

  caddy:
    profiles:
      - standalone
