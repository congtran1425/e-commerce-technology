openapi: 3.1.0
info:
  title: Một Mẻ Bánh API
  version: 0.1.0
  description: >-
    API cho danh mục công thức và kế hoạch mua nguyên liệu theo khẩu phần.
    Mọi yêu cầu thay đổi dữ liệu phải gửi header X-BDB-Client-Request: 1 để chống
    yêu cầu giả mạo từ trình duyệt, trừ webhook POST /payments/zalopay/callback
    được xác thực bằng chữ ký riêng. Origin của trình duyệt phải thuộc danh sách CORS.
    Đăng ký và đăng nhập có thể trả 429 sau nhiều lần thử; các thao tác cần phiên
    trả 401 nếu chưa xác thực và 403 nếu không đủ quyền.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/api
    description: Local development
security: []
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái API
      operationId: getHealth
      responses:
        "200":
          description: API đang hoạt động
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - timestamp
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    example: e-commerce-api
                  timestamp:
                    type: string
                    format: date-time
  /auth/register:
    post:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Tạo tài khoản khách hàng và gửi thư xác minh email (chưa đăng nhập)
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Đã nhận yêu cầu; không tiết lộ email đã tồn tại hay chưa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
        "400":
          description: Tên, email hoặc mật khẩu không hợp lệ
        "503":
          description: Chưa cấu hình dịch vụ gửi thư
        "429":
          description: Quá nhiều lần đăng ký trong 15 phút
  /auth/resend-verification:
    post:
      summary: Gửi lại thư xác minh nếu tài khoản đang chờ xác minh
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnlyRequest" }
      responses:
        "202": { description: Phản hồi chung, không tiết lộ trạng thái tài khoản }
        "429": { description: Quá nhiều yêu cầu }
  /auth/verify-email:
    post:
      summary: Xác minh email bằng mã dùng một lần
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountTokenRequest" }
      responses:
        "204": { description: Xác minh thành công; cần đăng nhập riêng }
        "400": { description: Mã không hợp lệ hoặc hết hạn }
        "429": { description: Quá nhiều yêu cầu }
  /auth/forgot-password:
    post:
      summary: Yêu cầu thư đặt lại mật khẩu
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnlyRequest" }
      responses:
        "202": { description: Phản hồi chung, không tiết lộ email có tài khoản }
        "429": { description: Quá nhiều yêu cầu }
  /auth/reset-password:
    post:
      summary: Đặt lại mật khẩu; thu hồi mọi phiên cũ
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Đổi mật khẩu thành công; cần đăng nhập lại }
        "400": { description: Mã không hợp lệ hoặc hết hạn }
        "429": { description: Quá nhiều yêu cầu }
  /auth/login:
    post:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Đăng nhập và tạo một phiên mới
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              description: Cookie phiên HttpOnly; tên production có tiền tố `__Host-`.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Dữ liệu gửi lên không hợp lệ
        "401":
          description: Email hoặc mật khẩu không đúng
        "403":
          description: Đúng mật khẩu nhưng email chưa xác minh
        "429":
          description: Quá nhiều lần đăng nhập thất bại trong 15 phút
  /auth/me:
    get:
      summary: Lấy tài khoản của phiên hiện tại
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Phiên hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Thiếu cookie, phiên hết hạn hoặc tài khoản không hoạt động
  /auth/logout:
    post:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Kết thúc phiên hiện tại và xóa cookie
      operationId: logout
      responses:
        "204":
          description: Đã kết thúc phiên hoặc trước đó không có phiên
  /recipes:
    get:
      summary: Lấy danh sách công thức đã xuất bản
      operationId: listRecipes
      responses:
        "200":
          description: Danh sách công thức
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeSummary"
  /recipes/{slug}:
    get:
      summary: Lấy công thức và gợi ý quy cách theo khẩu phần
      operationId: getRecipePlan
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: servings
          in: query
          required: false
          description: Số đơn vị thành phẩm (người, phần, cái hoặc ổ bánh), từ 1 đến 50. Bỏ trống để dùng định lượng gốc.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Công thức, định lượng và quy cách được đề xuất
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RecipeDetail"
        "400":
          description: Khẩu phần hoặc slug không hợp lệ
        "404":
          description: Không tìm thấy công thức đã xuất bản
  /cart/quote:
    post:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Kiểm tra lại giá và tồn kho của giỏ tạm
      operationId: quoteCart
      description: >-
        Không tạo giỏ hàng, không giữ hàng và không trừ kho. API chỉ trả về trạng thái hiện tại
        của các biến thể để client hiển thị trước khi thanh toán.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartQuoteRequest"
      responses:
        "200":
          description: Giá, tồn kho và tạm tính đã được đối chiếu
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CartQuote"
        "400":
          description: Danh sách biến thể hoặc số lượng không hợp lệ
  /orders:
    post:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Giữ tồn kho, tạo đơn và tạo giao dịch ZaloPay Sandbox
      operationId: createOrder
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Đơn đã được tạo; dùng `payment.checkoutUrl` để sang ZaloPay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Địa chỉ, mã chống tạo trùng hoặc mặt hàng không hợp lệ
        "401":
          description: Chưa đăng nhập
        "409":
          description: Không đủ tồn kho hoặc lần tạo đơn đã kết thúc
        "503":
          description: Máy chủ chưa được cấu hình ZaloPay
  /orders/{orderNumber}:
    get:
      summary: Xem một đơn thuộc tài khoản hiện tại
      operationId: getOrder
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Chi tiết đơn và lần thanh toán gần nhất
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Chưa đăng nhập
        "404":
          description: Không tìm thấy đơn hoặc đơn không thuộc tài khoản
  /orders/{orderNumber}/payment-status:
    post:
      summary: Đối chiếu trạng thái giao dịch với ZaloPay
      operationId: syncOrderPayment
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
        - $ref: "#/components/parameters/BrowserRequest"
      responses:
        "200":
          description: Trạng thái đơn sau khi đối chiếu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Chưa đăng nhập
        "404":
          description: Không tìm thấy đơn hoặc đơn không thuộc tài khoản
        "502":
          description: Chưa thể kết nối tới ZaloPay
  /account/overview:
    get:
      summary: Đọc tổng quan sổ bếp của khách hàng
      operationId: getAccountOverview
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Hồ sơ, số địa chỉ, số đơn và các đơn gần đây.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountOverviewResponse" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Phiên hiện tại không thuộc tài khoản khách hàng }
  /account/profile:
    patch:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Cập nhật tên hiển thị hoặc số điện thoại của khách hàng
      operationId: updateAccountProfile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountProfileRequest" }
      responses:
        "200":
          description: Hồ sơ sau khi cập nhật.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfileResponse" }
        "400": { description: Tên hoặc số điện thoại không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Sai nguồn gửi yêu cầu hoặc không phải tài khoản khách hàng }
        "404": { description: Không tìm thấy tài khoản }
  /account/orders:
    get:
      summary: Đọc lịch sử đơn của khách hàng hiện tại
      operationId: listAccountOrders
      description: Đơn mới nhất trước; mỗi trang tiếp theo dùng con trỏ là mã nội bộ của dòng cuối trang trước.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [AWAITING_PAYMENT, CONFIRMED, PAYMENT_REVIEW, PREPARING, SHIPPING, DELIVERED, CANCELLED]
        - name: cursor
          in: query
          schema: { type: string, pattern: "^[1-9]\\d*$", maxLength: 19 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Một trang lịch sử đơn chỉ thuộc tài khoản hiện tại.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountOrderPageResponse" }
        "400": { description: "Trạng thái, con trỏ hoặc giới hạn không hợp lệ" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Phiên hiện tại không thuộc tài khoản khách hàng }
  /account/addresses:
    get:
      summary: Đọc sổ địa chỉ của khách hàng hiện tại
      operationId: listAccountAddresses
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Địa chỉ mặc định đứng trước, sau đó đến địa chỉ mới cập nhật.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AccountAddress" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Phiên hiện tại không thuộc tài khoản khách hàng }
    post:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Thêm địa chỉ vào sổ của khách hàng hiện tại
      operationId: createAccountAddress
      description: Địa chỉ đầu tiên tự trở thành mặc định; mỗi khách chỉ có tối đa một địa chỉ mặc định.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountAddressRequest" }
      responses:
        "201":
          description: Địa chỉ đã được tạo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountAddressResponse" }
        "400": { description: Thông tin nơi nhận không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Sai nguồn gửi yêu cầu hoặc không phải tài khoản khách hàng }
  /account/addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9]\\d*$", maxLength: 19 }
    patch:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Sửa hoặc đặt địa chỉ mặc định
      operationId: updateAccountAddress
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountAddressRequest" }
      responses:
        "200":
          description: Địa chỉ sau khi cập nhật.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountAddressResponse" }
        "400": { description: Thông tin nơi nhận không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Sai nguồn gửi yêu cầu hoặc không phải tài khoản khách hàng }
        "404": { description: Địa chỉ không thuộc tài khoản hiện tại }
    delete:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Xóa địa chỉ khỏi sổ của khách hàng hiện tại
      operationId: deleteAccountAddress
      description: Nếu xóa địa chỉ mặc định, địa chỉ được cập nhật gần nhất còn lại sẽ thành mặc định.
      security:
        - sessionCookie: []
      responses:
        "204": { description: Đã xóa địa chỉ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Sai nguồn gửi yêu cầu hoặc không phải tài khoản khách hàng }
        "404": { description: Địa chỉ không thuộc tài khoản hiện tại }
  /admin/overview:
    get:
      summary: Đọc số liệu điều hành có thể kiểm chứng
      operationId: getAdminOverview
      description: Doanh thu ở đây là tổng giao dịch thành công, chưa phải lợi nhuận hay doanh thu kế toán.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Số đơn theo trạng thái, tiền đã thu, cảnh báo tồn kho và đơn gần nhất.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverviewResponse" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
  /admin/orders:
    get:
      summary: Tìm, lọc và phân trang đơn hàng
      operationId: listAdminOrders
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: status
          in: query
          schema: { type: string, enum: [ALL, AWAITING_PAYMENT, CONFIRMED, PAYMENT_REVIEW, PREPARING, SHIPPING, DELIVERED, CANCELLED], default: ALL }
        - name: cursor
          in: query
          schema: { type: string, pattern: "^[1-9]\\d*$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Danh sách đơn mới nhất trước, dùng con trỏ để tải tiếp.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderListResponse" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
  /admin/orders/{orderNumber}:
    get:
      summary: Đọc chi tiết một đơn hàng
      operationId: getAdminOrder
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Người nhận, địa chỉ, dòng hàng và các lần thanh toán của đơn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetailResponse" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "404": { description: Không tìm thấy đơn hàng }
  /admin/orders/{orderNumber}/status:
    patch:
      summary: Chuyển đơn sang bước hoàn tất kế tiếp
      operationId: updateAdminOrderStatus
      description: Chỉ cho phép đối soát → xác nhận → chuẩn bị → đang giao → đã giao; không cho bỏ bước hoặc lùi trạng thái.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminOrderStatusRequest" }
      responses:
        "200":
          description: Đơn hàng sau khi đổi trạng thái.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderSummaryResponse" }
        "400": { description: Trạng thái đích không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "404": { description: Không tìm thấy đơn hàng }
        "409": { description: Chuyển trạng thái sai thứ tự hoặc dữ liệu vừa bị thay đổi ở phiên khác }
  /admin/payments:
    get:
      summary: Đọc sổ giao dịch thanh toán
      operationId: listAdminPayments
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: status
          in: query
          schema: { type: string, enum: [ALL, PENDING, SUCCEEDED, FAILED, EXPIRED, CANCELLED, REFUND_PENDING, REFUNDED], default: ALL }
        - name: cursor
          in: query
          schema: { type: string, pattern: "^[1-9]\\d*$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Giao dịch mới nhất trước; không trả token hay địa chỉ thanh toán.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPaymentListResponse" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
  /admin/inventory:
    get:
      summary: Đọc cảnh báo tồn kho và biến động gần nhất
      operationId: getAdminInventoryOverview
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Quy cách có tồn kho không quá 5 và sổ biến động gần nhất.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInventoryOverviewResponse" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
  /admin/products:
    get:
      summary: Tìm và phân trang sản phẩm dành cho quản trị
      operationId: listAdminProducts
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: Tìm theo tên sản phẩm hoặc mã hàng.
          schema: { type: string, maxLength: 80 }
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, ACTIVE, INACTIVE]
            default: ALL
        - name: cursor
          in: query
          schema: { type: string, pattern: "^[1-9]\\d*$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Danh sách gồm cả sản phẩm đang bán và ngừng bán.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductListResponse"
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
    post:
      parameters:
        - $ref: "#/components/parameters/BrowserRequest"
      summary: Tạo sản phẩm cùng ít nhất một quy cách bán
      operationId: createAdminProduct
      description: >-
        Backend tự sinh đường dẫn ổn định. Tồn đầu của mỗi quy cách được ghi vào sổ kho;
        mã hàng không thể sửa sau khi tạo trong phiên bản này.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminProductRequest"
      responses:
        "201":
          description: Sản phẩm đã được tạo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductResponse" }
        "400": { description: Dữ liệu sản phẩm hoặc quy cách không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "409": { description: Đường dẫn hoặc mã hàng đã tồn tại }
  /admin/products/{productId}:
    patch:
      summary: Sửa thông tin hoặc trạng thái bán của sản phẩm
      operationId: updateAdminProduct
      description: Không xóa cứng và không đổi đường dẫn sản phẩm trong phiên bản này.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminProductRequest"
      responses:
        "200":
          description: Sản phẩm sau khi cập nhật.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductResponse" }
        "400": { description: Không có thay đổi hoặc dữ liệu không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "404": { description: Không tìm thấy sản phẩm }
  /admin/products/{productId}/variants:
    post:
      summary: Thêm một quy cách bán vào sản phẩm
      operationId: createAdminProductVariant
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminVariantRequest"
      responses:
        "201":
          description: Trả về sản phẩm cùng toàn bộ quy cách sau khi thêm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductResponse" }
        "400": { description: Dữ liệu quy cách không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "404": { description: Không tìm thấy sản phẩm }
        "409": { description: Mã hàng đã được sử dụng }
  /admin/product-variants/{variantId}:
    patch:
      summary: Sửa thông tin hoặc trạng thái bán của quy cách
      operationId: updateAdminProductVariant
      description: Mã hàng và tồn kho không được sửa qua endpoint này.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VariantId"
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminVariantRequest"
      responses:
        "200":
          description: Trả về sản phẩm chứa quy cách sau khi cập nhật.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductResponse" }
        "400": { description: Không có thay đổi hoặc dữ liệu không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "404": { description: Không tìm thấy quy cách }
  /admin/product-variants/{variantId}/inventory-movements:
    get:
      summary: Đọc các biến động kho gần nhất của một quy cách
      operationId: listAdminInventoryMovements
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VariantId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Các biến động mới nhất trước.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryMovement" }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "404": { description: Không tìm thấy quy cách }
  /admin/product-variants/{variantId}/inventory-adjustments:
    post:
      summary: Tăng hoặc giảm tồn kho và ghi sổ biến động
      operationId: createAdminInventoryAdjustment
      description: Không hỗ trợ ghi đè số dư tuyệt đối; cập nhật số dư và ghi sổ trong cùng giao dịch.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VariantId"
        - $ref: "#/components/parameters/BrowserRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustInventoryRequest"
      responses:
        "201":
          description: Số dư mới cùng dòng biến động vừa tạo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAdjustmentResponse"
        "400": { description: Lượng thay đổi hoặc lý do không hợp lệ }
        "401": { description: Chưa đăng nhập }
        "403": { description: Tài khoản không có vai trò quản trị }
        "404": { description: Không tìm thấy quy cách }
        "409": { description: Điều chỉnh sẽ làm tồn kho âm }
  /payments/zalopay/callback:
    post:
      summary: Nhận thông báo thanh toán trực tiếp từ ZaloPay
      operationId: receiveZaloPayCallback
      description: Endpoint công khai; backend xác minh HMAC bằng KEY2 trước khi cập nhật đơn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZaloPayCallbackRequest"
      responses:
        "200":
          description: Kết quả tiếp nhận theo giao thức callback của ZaloPay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZaloPayCallbackResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ecomtech_session
      description: Môi trường production dùng tên `__Host-ecomtech_session`.
  parameters:
    BrowserRequest:
      name: X-BDB-Client-Request
      in: header
      required: true
      description: Giá trị cố định `1`; ngoại lệ duy nhất là webhook ZaloPay có chữ ký.
      schema:
        type: string
        const: "1"
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema:
        type: string
        pattern: "^EC\\d{6}[A-Z0-9]{8}$"
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9]\\d*$", maxLength: 19 }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9]\\d*$", maxLength: 19 }
  schemas:
    OrderStatus:
      type: string
      enum: [AWAITING_PAYMENT, CONFIRMED, PAYMENT_REVIEW, PREPARING, SHIPPING, DELIVERED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, EXPIRED, CANCELLED, REFUND_PENDING, REFUNDED]
    AdminOverviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ordersByStatus, collectedRevenue, inventory, recentOrders]
          properties:
            ordersByStatus: { type: object, additionalProperties: { type: integer, minimum: 0 } }
            collectedRevenue:
              type: object
              required: [allTime, allTimePaymentCount, lastSevenDays, lastSevenDaysPaymentCount]
              properties:
                allTime: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
                allTimePaymentCount: { type: integer, minimum: 0 }
                lastSevenDays: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
                lastSevenDaysPaymentCount: { type: integer, minimum: 0 }
            inventory:
              type: object
              required: [outOfStockCount, lowStockCount, lowStockThreshold]
              properties:
                outOfStockCount: { type: integer, minimum: 0 }
                lowStockCount: { type: integer, minimum: 0 }
                lowStockThreshold: { type: integer, const: 5 }
            recentOrders:
              type: array
              items: { $ref: "#/components/schemas/AdminOrderSummary" }
    AdminOrderListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdminOrderSummary" } }
            nextCursor: { type: [string, "null"], pattern: "^[1-9]\\d*$" }
    AdminOrderSummaryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AdminOrderSummary" }
    AdminOrderSummary:
      type: object
      required: [id, orderNumber, status, currency, subtotal, shippingFee, total, recipientName, recipientPhone, province, itemCount, customer, latestPayment, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        orderNumber: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        currency: { type: string, const: VND }
        subtotal: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
        shippingFee: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
        total: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
        recipientName: { type: string }
        recipientPhone: { type: string }
        province: { type: string }
        itemCount: { type: integer, minimum: 0 }
        customer:
          type: object
          required: [displayName, email]
          properties:
            displayName: { type: string }
            email: { type: string, format: email }
        latestPayment:
          anyOf:
            - type: object
              required: [status, amount, paidAt]
              properties:
                status: { $ref: "#/components/schemas/PaymentStatus" }
                amount: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
                paidAt: { type: [string, "null"], format: date-time }
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminOrderDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/AdminOrderSummary"
            - type: object
              required: [address, note, items, payments]
              properties:
                address:
                  type: object
                  required: [addressLine, ward, district, province]
                  properties:
                    addressLine: { type: string }
                    ward: { type: [string, "null"] }
                    district: { type: string }
                    province: { type: string }
                note: { type: [string, "null"] }
                items: { type: array, items: { type: object } }
                payments: { type: array, items: { $ref: "#/components/schemas/AdminPayment" } }
    UpdateAdminOrderStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [CONFIRMED, PREPARING, SHIPPING, DELIVERED] }
    AdminPaymentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdminPayment" } }
            nextCursor: { type: [string, "null"], pattern: "^[1-9]\\d*$" }
    AdminPayment:
      type: object
      required: [id, provider, status, amount, merchantTransactionId, providerTransactionId, returnCode, returnMessage, expiresAt, paidAt, createdAt, updatedAt, order]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        provider: { type: string, const: ZALOPAY }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amount: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
        merchantTransactionId: { type: string }
        providerTransactionId: { type: [string, "null"] }
        returnCode: { type: [integer, "null"] }
        returnMessage: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        order:
          type: object
          required: [orderNumber, recipientName]
          properties:
            orderNumber: { type: string }
            recipientName: { type: string }
    AdminInventoryOverviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [lowStockThreshold, attentionVariants, recentMovements]
          properties:
            lowStockThreshold: { type: integer, const: 5 }
            attentionVariants: { type: array, items: { type: object } }
            recentMovements: { type: array, items: { type: object } }
    AdminProductListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminProduct" }
            nextCursor:
              type: [string, "null"]
              pattern: "^[1-9]\\d*$"
    AdminProductResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AdminProduct" }
    AdminProduct:
      type: object
      required: [id, slug, name, description, kind, imageUrl, active, createdAt, updatedAt, stockQuantity, variants]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { $ref: "#/components/schemas/ProductKind" }
        imageUrl: { type: [string, "null"], format: uri }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stockQuantity: { type: integer, minimum: 0 }
        variants:
          type: array
          items: { $ref: "#/components/schemas/AdminProductVariant" }
    AdminProductVariant:
      type: object
      required: [id, sku, label, unit, packageQuantity, price, currency, stockQuantity, active]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        sku: { type: string, maxLength: 80 }
        label: { type: string, maxLength: 180 }
        unit: { $ref: "#/components/schemas/MeasurementUnit" }
        packageQuantity: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
        price: { type: string, pattern: "^\\d+(\\.\\d+)?$" }
        currency: { type: string, const: VND }
        stockQuantity: { type: integer, minimum: 0 }
        active: { type: boolean }
    ProductKind:
      type: string
      enum: [INGREDIENT, TOOL]
    MeasurementUnit:
      type: string
      enum: [GRAM, MILLILITER, PIECE]
    CreateAdminProductRequest:
      type: object
      additionalProperties: false
      required: [name, description, kind, variants]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, minLength: 1, maxLength: 500 }
        kind: { $ref: "#/components/schemas/ProductKind" }
        imageUrl: { type: [string, "null"], format: uri, maxLength: 500 }
        active: { type: boolean, default: true }
        variants:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CreateAdminVariantRequest" }
    UpdateAdminProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, minLength: 1, maxLength: 500 }
        imageUrl: { type: [string, "null"], format: uri, maxLength: 500 }
        active: { type: boolean }
    CreateAdminVariantRequest:
      type: object
      additionalProperties: false
      required: [sku, label, unit, packageQuantity, price, stockQuantity]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        label: { type: string, minLength: 1, maxLength: 180 }
        unit: { $ref: "#/components/schemas/MeasurementUnit" }
        packageQuantity: { type: number, exclusiveMinimum: 0, maximum: 1000000, multipleOf: 0.001 }
        price: { type: integer, minimum: 0, maximum: 999999999 }
        stockQuantity: { type: integer, minimum: 0, maximum: 1000000 }
        active: { type: boolean, default: true }
    UpdateAdminVariantRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 180 }
        unit: { $ref: "#/components/schemas/MeasurementUnit" }
        packageQuantity: { type: number, exclusiveMinimum: 0, maximum: 1000000, multipleOf: 0.001 }
        price: { type: integer, minimum: 0, maximum: 999999999 }
        active: { type: boolean }
    AdjustInventoryRequest:
      type: object
      additionalProperties: false
      required: [quantityDelta, reason]
      properties:
        quantityDelta:
          type: integer
          minimum: -1000000
          maximum: 1000000
          not: { const: 0 }
        reason:
          type: string
          enum: [RESTOCK, CORRECTION, DAMAGED, RETURNED]
        note: { type: string, maxLength: 300 }
    InventoryAdjustmentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [variantId, stockQuantity, movement]
          properties:
            variantId: { type: string, pattern: "^[1-9]\\d*$" }
            stockQuantity: { type: integer, minimum: 0 }
            movement: { $ref: "#/components/schemas/InventoryMovement" }
    InventoryMovement:
      type: object
      required: [id, quantityDelta, stockBefore, stockAfter, reason, note, createdAt, actorName, orderNumber]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        quantityDelta: { type: integer }
        stockBefore: { type: integer, minimum: 0 }
        stockAfter: { type: integer, minimum: 0 }
        reason:
          type: string
          enum: [INITIAL_STOCK, RESTOCK, CORRECTION, DAMAGED, RETURNED, ORDER_RESERVED, ORDER_RELEASED]
        note: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        actorName: { type: [string, "null"] }
        orderNumber: { type: [string, "null"] }
    EmailOnlyRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AccountTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
        password: { type: string, minLength: 10, maxLength: 128 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/AuthUser"
    AuthUser:
      type: object
      required: [id, email, displayName, phone, role]
      properties:
        id:
          type: string
          pattern: "^[1-9]\\d*$"
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type: [string, "null"]
          description: Số điện thoại Việt Nam đã chuẩn hóa hoặc null nếu chưa bổ sung.
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
    AccountProfile:
      type: object
      required: [id, email, displayName, phone, createdAt]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        email: { type: string, format: email }
        displayName: { type: string }
        phone: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    AccountProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AccountProfile" }
    UpdateAccountProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 2, maxLength: 100 }
        phone:
          type: [string, "null"]
          description: Số Việt Nam bắt đầu bằng 0 hoặc +84; gửi null hoặc chuỗi rỗng để xóa.
    AccountAddress:
      type: object
      required: [id, label, recipientName, phone, addressLine, ward, district, province, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        label: { type: string, maxLength: 40 }
        recipientName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        addressLine: { type: string, maxLength: 250 }
        ward: { type: [string, "null"], maxLength: 120 }
        district: { type: string, maxLength: 120 }
        province: { type: string, maxLength: 120 }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountAddressResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AccountAddress" }
    CreateAccountAddressRequest:
      type: object
      additionalProperties: false
      required: [label, recipientName, phone, addressLine, district, province]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        recipientName: { type: string, minLength: 1, maxLength: 100 }
        phone:
          type: string
          maxLength: 20
          description: Số Việt Nam bắt đầu bằng 0 hoặc +84; khoảng trắng, dấu chấm và gạch ngang được chuẩn hóa.
        addressLine: { type: string, minLength: 1, maxLength: 250 }
        ward: { type: string, maxLength: 120 }
        district: { type: string, minLength: 1, maxLength: 120 }
        province: { type: string, minLength: 1, maxLength: 120 }
        isDefault: { type: boolean, default: false }
    UpdateAccountAddressRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        recipientName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        addressLine: { type: string, minLength: 1, maxLength: 250 }
        ward: { type: [string, "null"], maxLength: 120 }
        district: { type: string, minLength: 1, maxLength: 120 }
        province: { type: string, minLength: 1, maxLength: 120 }
        isDefault:
          type: boolean
          const: true
    AccountOrderSummary:
      type: object
      required: [orderNumber, status, currency, total, recipientName, itemCount, paymentStatus, createdAt]
      properties:
        orderNumber: { type: string }
        status:
          type: string
          enum: [AWAITING_PAYMENT, CONFIRMED, PAYMENT_REVIEW, PREPARING, SHIPPING, DELIVERED, CANCELLED]
        currency: { type: string, const: VND }
        total: { type: string, example: "160000.00" }
        recipientName: { type: string }
        itemCount: { type: integer, minimum: 0 }
        paymentStatus:
          type: [string, "null"]
          enum: [PENDING, SUCCEEDED, FAILED, EXPIRED, CANCELLED, REFUND_PENDING, REFUNDED, null]
        createdAt: { type: string, format: date-time }
    AccountOrderPageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountOrderSummary" }
            nextCursor: { type: [string, "null"] }
    AccountOverviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [profile, addressCount, orderCount, recentOrders]
          properties:
            profile: { $ref: "#/components/schemas/AccountProfile" }
            addressCount: { type: integer, minimum: 0 }
            orderCount: { type: integer, minimum: 0 }
            recentOrders:
              type: array
              items: { $ref: "#/components/schemas/AccountOrderSummary" }
    CartQuoteRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId:
                type: string
                pattern: "^[1-9]\\d*$"
              quantity:
                type: integer
                minimum: 1
                maximum: 99
    CartQuote:
      type: object
      required: [items, subtotal, currency, canCheckout]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartQuoteItem"
        subtotal:
          type: string
          description: Số tiền thập phân hai chữ số, không dùng số thực.
          example: "205000.00"
        currency:
          type: string
          const: VND
        canCheckout:
          type: boolean
          description: Chỉ true khi tất cả biến thể tồn tại, còn bán và đủ tồn kho.
    CartQuoteItem:
      type: object
      required: [variantId, productName, label, requestedQuantity, availableQuantity, unitPrice, lineTotal, currency, status]
      properties:
        variantId: { type: string }
        productName: { type: [string, "null"] }
        label: { type: [string, "null"] }
        requestedQuantity: { type: integer }
        availableQuantity: { type: [integer, "null"] }
        unitPrice: { type: [string, "null"] }
        lineTotal: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        status:
          type: string
          enum: [AVAILABLE, INSUFFICIENT_STOCK, UNAVAILABLE]
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, recipient, items]
      properties:
        idempotencyKey:
          type: string
          format: uuid
          description: Mã duy nhất cho một lần bấm đặt hàng, dùng để chống tạo đơn trùng.
        recipient:
          $ref: "#/components/schemas/OrderRecipientInput"
        note:
          type: string
          maxLength: 500
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [variantId, quantity]
            properties:
              variantId:
                type: string
                pattern: "^[1-9]\\d*$"
              quantity:
                type: integer
                minimum: 1
                maximum: 99
    OrderRecipientInput:
      type: object
      additionalProperties: false
      required: [name, phone, addressLine, district, province]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        phone:
          type: string
          description: Số Việt Nam bắt đầu bằng 0 hoặc +84; khoảng trắng, dấu chấm và gạch ngang được chuẩn hóa.
        addressLine: { type: string, minLength: 1, maxLength: 250 }
        ward: { type: string, maxLength: 120 }
        district: { type: string, minLength: 1, maxLength: 120 }
        province: { type: string, minLength: 1, maxLength: 120 }
    OrderResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Order"
    Order:
      type: object
      required: [orderNumber, status, currency, subtotal, shippingFee, total, recipient, items, payment, createdAt, updatedAt]
      properties:
        orderNumber: { type: string }
        status:
          type: string
          enum: [AWAITING_PAYMENT, CONFIRMED, PAYMENT_REVIEW, PREPARING, SHIPPING, DELIVERED, CANCELLED]
        currency: { type: string, const: VND }
        subtotal: { type: string, example: "160000.00" }
        shippingFee: { type: string, example: "0.00" }
        total: { type: string, example: "160000.00" }
        recipient:
          allOf:
            - $ref: "#/components/schemas/OrderRecipientInput"
            - type: object
              properties:
                ward: { type: [string, "null"] }
        note: { type: [string, "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payment:
          oneOf:
            - $ref: "#/components/schemas/Payment"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderItem:
      type: object
      required: [id, variantId, productName, sku, variantLabel, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, pattern: "^[1-9]\\d*$" }
        variantId: { type: [string, "null"] }
        productName: { type: string }
        sku: { type: string }
        variantLabel: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: string }
        lineTotal: { type: string }
    Payment:
      type: object
      required: [provider, status, checkoutUrl, expiresAt, paidAt]
      properties:
        provider: { type: string, const: ZALOPAY }
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, EXPIRED, CANCELLED, REFUND_PENDING, REFUNDED]
        checkoutUrl: { type: [string, "null"], format: uri }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
    ZaloPayCallbackRequest:
      type: object
      required: [data, mac]
      properties:
        data:
          type: string
          description: Chuỗi JSON nguyên bản do ZaloPay ký.
        mac:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        type: { type: integer }
    ZaloPayCallbackResponse:
      type: object
      required: [return_code, return_message]
      properties:
        return_code: { type: integer, enum: [-1, 0, 1] }
        return_message: { type: string }
    RecipeSummary:
      type: object
      required: [slug, title, summary, imageUrl, baseServings, yieldUnit, yieldUnitLabel, category, categoryLabel, prepMinutes, bakeMinutes, totalMinutes, difficulty, difficultyLabel]
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        imageUrl:
          type: [string, "null"]
          format: uri-reference
          description: Đường dẫn bắt đầu bằng / được trình duyệt lấy từ miền frontend; null khi chưa có ảnh.
        baseServings: { type: integer }
        yieldUnit: { type: string, enum: [PERSON, PORTION, PIECE, LOAF] }
        yieldUnitLabel: { type: string }
        category: { type: string, enum: [COOKIE, CAKE, DESSERT, BREAD] }
        categoryLabel: { type: string }
        prepMinutes: { type: integer }
        bakeMinutes: { type: integer }
        totalMinutes: { type: integer }
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
        difficultyLabel: { type: string }
    RecipeDetail:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          required: [story, servings, temperatureC, steps, ingredients, tools]
          properties:
            story: { type: string }
            servings: { type: integer }
            temperatureC: { type: [integer, "null"] }
            steps:
              type: array
              items:
                type: object
                required: [id, stepNumber, title, instruction, durationMinutes, temperatureC]
                properties:
                  id: { type: string }
                  stepNumber: { type: integer }
                  title: { type: [string, "null"] }
                  instruction: { type: string }
                  durationMinutes: { type: [integer, "null"] }
                  temperatureC: { type: [integer, "null"] }
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/IngredientPlan"
            tools:
              type: array
              items:
                $ref: "#/components/schemas/ToolPlan"
    IngredientPlan:
      type: object
      required: [id, name, unit, requiredQuantity, recommendation]
      properties:
        id: { type: string }
        name: { type: string }
        unit: { type: string, enum: [g, ml, cái] }
        requiredQuantity: { type: string, description: Số thập phân truyền dưới dạng chuỗi }
        note: { type: [string, "null"] }
        recommendation:
          oneOf:
            - $ref: "#/components/schemas/PackageSelection"
            - type: "null"
    PackageSelection:
      type: object
      required: [packages, suppliedQuantity, surplusQuantity, totalPrice, totalPacks]
      properties:
        packages:
          type: array
          items:
            type: object
            required: [id, label, packageQuantity, price, stockQuantity, count]
            properties:
              id: { type: string }
              label: { type: string }
              packageQuantity: { type: string }
              price: { type: string }
              stockQuantity: { type: integer }
              count: { type: integer }
        suppliedQuantity: { type: string }
        surplusQuantity: { type: string }
        totalPrice: { type: string }
        totalPacks: { type: integer }
    ToolPlan:
      type: object
      required: [id, name, required, product]
      properties:
        id: { type: string }
        name: { type: string }
        required: { type: boolean }
        product:
          oneOf:
            - type: object
              required: [variantId, name, label, price, currency]
              properties:
                variantId: { type: string }
                name: { type: string }
                label: { type: string }
                price: { type: string }
                currency: { type: string }
            - type: "null"
