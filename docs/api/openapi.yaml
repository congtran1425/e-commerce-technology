openapi: 3.1.0
info:
  title: E-commerce Technology API
  version: 0.1.0
  description: API contract skeleton. Endpoints will be added with their implementation.
servers:
  - url: http://localhost:3000/api
    description: Local development
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái API
      operationId: getHealth
      responses:
        "200":
          description: API đang hoạt động
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - timestamp
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    example: e-commerce-api
                  timestamp:
                    type: string
                    format: date-time
